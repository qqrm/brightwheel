name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: vX.Y.Z tag to release
        required: true
        type: string
      create_tag:
        description: Create the tag from the selected main commit after release checks pass
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Required with create_tag; exact 40-character main commit SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.create_tag && github.sha || inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Validate release version
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $commit = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Cannot resolve the checked-out release commit.'
          }
          if ($env:CREATE_TAG -eq 'true') {
            if ($env:EVENT_NAME -cne 'workflow_dispatch' -or $env:WORKFLOW_REF -cne 'refs/heads/main') {
              throw 'Creating a release tag requires a manual dispatch from main.'
            }
            if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$' -or
                $env:EXPECTED_SHA -cne $env:WORKFLOW_SHA -or $env:EXPECTED_SHA -cne $commit) {
              throw 'expected_sha must exactly match the workflow and checked-out main commit.'
            }
          }

          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$tag' is not in vX.Y.Z form."
          }
          $version = $Matches.version

          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq 'brightwheel'
          if (-not $package -or $package.version -ne $version) {
            throw "Tag version $version does not match the brightwheel package version."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: cargo-nextest
          fallback: none

      - name: Run tests with nextest
        run: cargo nextest run --all-targets --locked

      - name: Verify crate package
        run: cargo publish --dry-run --locked

      - name: Build release binaries
        id: release_build
        run: cargo build --release --locked

      - name: Verify application identity
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/application-identity.ps1

      - name: Verify real autostart registration and tray preferences
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: powershell
        run: ./scripts/e2e/autostart.ps1

      - name: Install WinGet source fixture dependencies
        id: winget_source_dependencies
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r scripts/e2e/winget-test-source-requirements.txt

      - name: Test the WinGet source fixture
        id: winget_source_tests
        if: ${{ !cancelled() && steps.winget_source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            throw 'OpenSSL is required; the TLS fixture tests must not be skipped in CI.'
          }
          python -m unittest discover -s scripts/e2e -p test_winget_test_source.py -v

      - name: Package the installer test fixture
        id: installer_fixture
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 999.0.1 -OutputDirectory target/package-e2e

      - name: Verify Inno script and native process controls
        id: inno_probe
        if: ${{ !cancelled() && steps.installer_fixture.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/inno-array-probe.ps1 -ReportDirectory "$env:RUNNER_TEMP/winget-upgrade-brightwheel/inno-array-probe"

      - name: Verify real WinGet upgrades before publication
        if: ${{ !cancelled() && steps.installer_fixture.outcome == 'success' && steps.winget_source_tests.outcome == 'success' && steps.inno_probe.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./scripts/e2e/winget-upgrade.ps1
          -Application brightwheel
          -InstallerPath target/package-e2e/brightwheel-setup.exe
          -ExecutablePath target/release/brightwheel.exe
          -LegacyVersion 0.1.9
          -PackageVersion 999.0.1
          -ManifestDirectory target/package-e2e/winget
          -BuildScriptPath scripts/package-windows.ps1

      - name: Preserve Windows package test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-windows-package-e2e
          path: ${{ runner.temp }}/winget-upgrade-brightwheel
          if-no-files-found: ignore
          retention-days: 7

      - name: Package release assets
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version = $env:VERSION
          ./scripts/package-windows.ps1 -Version $version
          $dist = (Resolve-Path 'target/dist').Path
          $zipName = "brightwheel-$version-x86_64-pc-windows-msvc.zip"
          "dist=$dist" >> $env:GITHUB_OUTPUT
          "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Create tag at the tested commit
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TESTED_SHA: ${{ steps.release.outputs.commit }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $tag = $env:TAG
          $commit = & git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$' -or
              $commit -cne $env:EXPECTED_SHA -or $commit -cne $env:TESTED_SHA) {
            throw 'The release commit changed after validation; refusing to create a tag.'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git"
          $refUrl = "$api/ref/tags/$tag"
          $response = Invoke-WebRequest -Uri $refUrl -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
          if ($response.StatusCode -eq 404) {
            $body = @{ ref = "refs/tags/$tag"; sha = $commit } | ConvertTo-Json -Compress
            $response = Invoke-WebRequest -Method Post -Uri "$api/refs" -Headers $headers -ContentType 'application/json' -Body $body -SkipHttpErrorCheck -TimeoutSec 30
            if ($response.StatusCode -eq 422) {
              # A concurrent run may have created the tag. Only the same commit is acceptable.
              $response = Invoke-WebRequest -Uri $refUrl -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
              if ($response.StatusCode -ne 200) {
                throw "Cannot verify the release tag after a creation conflict (HTTP $($response.StatusCode))."
              }
            } elseif ($response.StatusCode -ne 201) {
              throw "Cannot create the release tag (HTTP $($response.StatusCode))."
            }
          } elseif ($response.StatusCode -ne 200) {
            throw "Cannot inspect the release tag (HTTP $($response.StatusCode))."
          }

          $reference = $response.Content | ConvertFrom-Json
          if ($reference.ref -cne "refs/tags/$tag" -or $reference.object.type -cne 'commit' -or
              $reference.object.sha -cne $commit) {
            throw 'The release tag already points to a different object; tags must never be moved.'
          }
          Write-Host "Release tag $tag points to tested commit $commit."

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          DIST: ${{ steps.assets.outputs.dist }}
          ZIP: ${{ steps.assets.outputs.zip }}
        run: |
          $tag = $env:TAG
          $version = $env:VERSION
          $dist = $env:DIST
          $isPrerelease = $version.Contains('-')
          $assets = @(
            (Join-Path $dist 'brightwheel.exe'),
            (Join-Path $dist 'bright.exe'),
            (Join-Path $dist $env:ZIP),
            (Join-Path $dist 'SHA256SUMS.txt')
          )
          if (-not $isPrerelease) {
            $assets += @(
              (Join-Path $dist 'brightwheel-setup.exe'),
              (Join-Path $dist 'brightwheel-winget-manifests.zip')
            )
          }
          $installationNotes = if ($isPrerelease) {
            'This prerelease contains portable executables only. Download `brightwheel.exe` to run the tray app; `bright.exe` is the optional command-line companion. The ZIP contains both executables.'
          } else {
            @'
          Use `brightwheel-setup.exe` for a per-user installation with automatic shutdown and restart when upgrading a running copy. Existing WinGet portable installations are migrated in place, preserving their autostart choice and command alias. A stopped application stays stopped during a silent upgrade.

          `brightwheel.exe` remains the standalone tray app. `bright.exe` is the optional command-line companion. The ZIP contains both portable executables.

          `brightwheel-winget-manifests.zip` contains the generated manifests for the installer. UniGetUI/WinGet will use the new package after its manifest is accepted in microsoft/winget-pkgs.
          '@
          }
          $notes = Join-Path $dist 'RELEASE_NOTES.md'
          @"
          BrightWheel $version

          Windows tray application for DDC/CI monitor brightness and HDR control.

          $installationNotes

          Requirements: 64-bit Windows 10/11 and an external monitor with DDC/CI enabled. The executables are unsigned, so Windows SmartScreen may show a warning on first launch.
          "@ | Set-Content $notes -Encoding utf8NoBOM

          & gh release view $tag *> $null
          $releaseKind = if ($isPrerelease) { '--prerelease' } else { '--prerelease=false' }
          if ($LASTEXITCODE -eq 0) {
            & gh release edit $tag --title "BrightWheel $version" --notes-file $notes $releaseKind
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the GitHub Release.' }
            & gh release upload $tag @assets --clobber
          } else {
            & gh release create $tag @assets --verify-tag --title "BrightWheel $version" --notes-file $notes $releaseKind
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload GitHub Release assets.' }

      - name: Authenticate with crates.io trusted publishing
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

      - name: Publish crate
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) {
            throw 'crates.io trusted publishing did not return a token.'
          }

          $output = & cargo publish --locked 2>&1
          $exitCode = $LASTEXITCODE
          $text = $output | Out-String
          Write-Host $text
          if ($exitCode -eq 0) { exit 0 }
          if ($text -match 'already uploaded|already exists|already published') {
            Write-Host 'This crate version is already published; treating the release as successful.'
            exit 0
          }
          throw 'cargo publish failed.'
