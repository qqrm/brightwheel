name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-nextest
          fallback: none

      - name: Run tests with nextest
        run: cargo nextest run --all-targets --locked

      - name: Check documentation
        run: cargo doc --no-deps --locked

      - name: Verify crate package
        run: cargo publish --dry-run --locked

  dependency-security:
    name: Dependency security
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependency tooling
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency advisories and sources
        run: cargo deny check advisories bans sources

      - name: Check unused dependencies
        run: cargo machete
