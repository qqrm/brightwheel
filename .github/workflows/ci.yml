name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: cargo-nextest
          fallback: none

      - name: Run tests with nextest
        run: cargo nextest run --all-targets --locked

      - name: Check documentation
        run: cargo doc --no-deps --locked

      - name: Verify crate package
        run: cargo publish --dry-run --locked

  updater-live:
    name: Live updater E2E
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build both production binaries
        id: release_build
        run: cargo build --release --locked
      - name: Verify application identity
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/application-identity.ps1
      - name: Tray recovery and process replacement
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/tray-lifecycle.ps1 -RestartExplorer
      - name: Autostart registration and tray preferences
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: powershell
        run: ./scripts/e2e/autostart.ps1
      - name: Automatic update startup preferences
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/startup-updates.ps1
      - name: Install WinGet source fixture dependencies
        id: winget_source_dependencies
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r scripts/e2e/winget-test-source-requirements.txt
      - name: Test the WinGet source fixture
        id: winget_source_tests
        if: ${{ !cancelled() && steps.winget_source_dependencies.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            throw 'OpenSSL is required; the TLS fixture tests must not be skipped in CI.'
          }
          python -m unittest discover -s scripts/e2e -p test_winget_test_source.py -v
      - name: Package the installer test fixture
        id: installer_fixture
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 999.0.1 -OutputDirectory target/package-e2e
      - name: Real WinGet upgrades and installer-managed updates
        if: ${{ !cancelled() && steps.installer_fixture.outcome == 'success' && steps.winget_source_tests.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/e2e/winget-upgrade.ps1
          -Application brightwheel
          -InstallerPath target/package-e2e/brightwheel-setup.exe
          -ExecutablePath target/release/brightwheel.exe
          -LegacyVersion 0.1.9
          -PackageVersion 999.0.1
          -ManifestDirectory target/package-e2e/winget
          -BuildScriptPath scripts/package-windows.ps1
      - name: Live upgrade and no-op behavior
        if: ${{ !cancelled() && steps.release_build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/e2e/updater-live.ps1 -Application brightwheel
      - name: Preserve Windows package test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-package-e2e
          path: ${{ runner.temp }}/winget-upgrade-brightwheel
          if-no-files-found: ignore
          retention-days: 7

  dependency-security:
    name: Dependency security
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install dependency tooling
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency advisories and sources
        run: cargo deny check advisories bans sources

      - name: Check unused dependencies
        run: cargo machete
